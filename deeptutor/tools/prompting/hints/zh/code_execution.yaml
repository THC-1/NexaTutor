short_description: "在 SYSTEM 隔离 Runner 中运行用户明确启用的 Python，返回 stdout/stderr。"
when_to_use: "当计算、算法校验或数值验证比纯手算更可靠时使用。"
input_format: "`language: python` + `code`——使用允许 import 的完整源码。可选 `timeout`（秒，默认 30）。"
guideline: "自行写出完整源码并把结果打印到 stdout；代码执行适合做客观验证，不应替代文字解释。"
note: "没有健康的 SYSTEM 隔离 argv Runner 时不可用；禁止 Shell、subprocess 与网络 import。这是风险降低机制，不是面向恶意代码的强沙箱。"
phase: "verification"
aliases:
  - name: run_code
    description: "运行 Python，用于计算、验证或可视化。"
    input_format: "`language: python` + `code`；可选 `timeout`。"
    when_to_use: "适合做客观校验、快速计算或小规模实验。"
    phase: "verification"
