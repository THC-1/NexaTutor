# ============================================
# NexaTutor Docker Compose - Pre-built GHCR Image
# ============================================
# Run NexaTutor using the official pre-built image from GitHub Container Registry.
# No local build required — the image is pulled automatically.
#
# Usage:
#   python scripts/docker_compose.py -f docker-compose.ghcr.yml up -d
#
# To pin a specific version:
#   Edit the image tag below, e.g. ghcr.io/thc-1/nexatutor:1.0.0
#
# Prerequisites:
#   1. Configure providers in data/user/settings/model_catalog.json or the UI
#   2. Use scripts/docker_compose.py so port mappings are rendered from system.json
#   3. Read the API URL note below before starting
#
# Local LLM (LM Studio / Ollama / vLLM):
#   Use "host.docker.internal" instead of "localhost" in provider base_url fields.
#   Configure provider endpoints in data/user/settings/model_catalog.json or the UI.
#
# The frontend and backend ports below are published on host loopback only.

services:
  nexatutor:
    image: ghcr.io/thc-1/nexatutor:latest
    pull_policy: always
    container_name: nexatutor
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEXATUTOR_DOCKER_BACKEND_PORT:-8001}:${NEXATUTOR_DOCKER_BACKEND_PORT:-8001}"
      - "127.0.0.1:${NEXATUTOR_DOCKER_FRONTEND_PORT:-3782}:${NEXATUTOR_DOCKER_FRONTEND_PORT:-3782}"

    volumes:
      # Persist the complete local data tree, including the workspace, settings
      # and Codex credentials, across recreation.
      - ./data:/app/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${NEXATUTOR_DOCKER_BACKEND_PORT:-8001}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    networks:
      - nexatutor-network

networks:
  nexatutor-network:
    driver: bridge
